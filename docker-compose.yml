# Multica runtime home-base — compose / laptop parity with the K8s Secret
# mount contract (no cluster required).
#
#   mkdir -p secrets/multica-home secrets/cursor secrets/claude secrets/git
#   cp examples/secrets/multica-home/config.json.example secrets/multica-home/config.json
#   cp examples/secrets/multica-home/daemon.id.example   secrets/multica-home/daemon.id
#   printf '%s' "$CURSOR_API_KEY" > secrets/cursor/CURSOR_API_KEY
#   # optional Claude Code harness (MULTICA_AGENT_CLI=claude):
#   printf '%s' "$ANTHROPIC_API_KEY" > secrets/claude/ANTHROPIC_API_KEY
#   printf '%s' "$GITHUB_TOKEN"   > secrets/git/GITHUB_TOKEN
#   # optional: still use .env for non-secret knobs (URLs, workspace id)
#   cp .env.example .env
#   docker compose up -d --build
#   docker compose logs -f
#   docker compose down
#
# Scratch shell (bypasses hard gates): docker compose run --rm --entrypoint bash runtime
#
# Boot seam (Ready vs Crash fixtures, no real Multica cloud required):
#   ./test/boot/run-seam.sh
#
# Repos are NOT cloned at start. First task may cold-clone via `multica repo checkout`.
#
# Volume roles:
#   - workspaces: durable (.repos, worktrees, asdf, provider homes / AWS SSO cache)
#   - Multica home is Secret-projected / bind-mounted — NOT a named volume
#   - AWS config stubs: bind-mount examples/aws (replace with private allowlist)
#
# Operator AWS SSO login (after healthy):
#   docker compose exec -e AWS_SSO_OPERATOR_LOGIN=1 runtime \
#     aws-sso login --url-action=print

services:
  runtime:
    image: multica-runtime:local
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      MULTICA_WORKSPACES_ROOT: /home/agent/workspaces
      MULTICA_AGENT_RUNTIME_NAME: ${MULTICA_AGENT_RUNTIME_NAME:-multica-runtime}
      # Runtime-list display name: multica shows "<Provider> (<machine name>)".
      # Unset = container hostname (the pod name under Kubernetes).
      MULTICA_MACHINE_NAME: ${MULTICA_MACHINE_NAME:-}
      # Container-stdout daemon log level: DEBUG|INFO|WARN|ERROR (default INFO).
      MULTICA_LOG_LEVEL: ${MULTICA_LOG_LEVEL:-INFO}
      # Secret dirs match K8s projected mounts (see examples/k8s/).
      MULTICA_HOME_SECRET_DIR: /run/secrets/multica-home
      CURSOR_API_KEY_FILE: /run/secrets/cursor/CURSOR_API_KEY
      # Claude Code harness credentials (only read when MULTICA_AGENT_CLI
      # includes claude; one of the three satisfies the gate).
      ANTHROPIC_API_KEY_FILE: /run/secrets/claude/ANTHROPIC_API_KEY
      CLAUDE_CODE_OAUTH_TOKEN_FILE: /run/secrets/claude/CLAUDE_CODE_OAUTH_TOKEN
      ANTHROPIC_AUTH_TOKEN_FILE: /run/secrets/claude/ANTHROPIC_AUTH_TOKEN
      # Agent CLI harnesses provisioned + gated at boot: cursor | claude |
      # cursor,claude. Default cursor = pre-Claude boot contract unchanged.
      MULTICA_AGENT_CLI: ${MULTICA_AGENT_CLI:-cursor}
      GITHUB_TOKEN_FILE: /run/secrets/git/GITHUB_TOKEN
      # AWS auth: prefer IRSA/instance-profile where available (README tiers).
      # Do not set AWS_PROFILE — callers pass --profile explicitly.
      # Optional static-key fallback (uncomment with secrets/aws mount):
      # AWS_CONFIG_FILE: /run/secrets/aws/config
      # AWS_SHARED_CREDENTIALS_FILE: /run/secrets/aws/credentials
    volumes:
      # Workspaces PVC role: .repos bare cache, task worktrees, asdf data, provider homes.
      - multica-workspaces:/home/agent/workspaces
      # Secret projection parity (bind-mount local secrets/ tree).
      - ./secrets/multica-home:/run/secrets/multica-home:ro
      - ./secrets/cursor:/run/secrets/cursor:ro
      - ./secrets/claude:/run/secrets/claude:ro
      - ./secrets/git:/run/secrets/git:ro
      # Optional — AWS auth tier 3 static keys (mounted config/credentials).
      # - ./secrets/aws:/run/secrets/aws:ro
      # AWS ConfigMap / aws-sso parity (generic stubs; override for private allowlist).
      - ./examples/aws/config:/run/config/aws/config:ro
      - ./examples/aws/config.yaml:/run/config/aws-sso/config.yaml:ro

    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/ready.sh"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  multica-workspaces:
