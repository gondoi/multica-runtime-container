# Multi-arch publish to ghcr.io/gondoi/multica-runtime.
# Contract: semver only — publish runs from a `vX.Y.Z` release tag (created by
# Release Please when the release PR merges) or a manual dispatch on such a tag.
# Tags pushed: `vX.Y.Z` + `X.Y.Z`. No commit-SHA tags, no `latest`.
name: Build and publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  # One publish per release tag; never cancel a release mid-push, queue instead.
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          # No tag, no publish: images are addressed by release version, not SHA.
          if [ "${GITHUB_REF_TYPE:?}" != "tag" ]; then
            echo "::error::publish runs only from a semver release tag (vX.Y.Z); got ${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}"
            exit 1
          fi
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag ${GITHUB_REF_NAME} is not semver (vX.Y.Z)"
            exit 1
          fi
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  docker:
    needs: prepare
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: FuelLabs/github-actions/.github/workflows/docker-build-push.yml@c2b9e5cd3e20180538f1b2d2841636e85eddfab4
    with:
      auth-mode: registry-login
      registry: ghcr.io
      dockerfile: Dockerfile
      docker-context: .
      image: ghcr.io/gondoi/multica-runtime
      build-backend: native
      platforms: linux/amd64,linux/arm64
      runs-on: ubuntu-latest
      runs-on-amd64: ubuntu-latest
      runs-on-arm64: ubuntu-24.04-arm
      flavor: |
        latest=false
      labels: |
        org.opencontainers.image.source=https://github.com/${{ github.repository }}
        org.opencontainers.image.description=Multica runtime home-base (thin agent daemon image)
        org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
        org.opencontainers.image.revision=${{ github.sha }}
      tags: |
        type=semver,pattern={{raw}}
        type=semver,pattern={{version}}
    secrets:
      REGISTRY_USERNAME: ${{ github.repository_owner }}
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  # GITHUB_TOKEN publishes packages as private by default for a private source repo.
  # Contract requires anonymous GHCR pull — flip visibility after push.
  make-public:
    needs: docker
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      packages: write
    steps:
      - name: Set ghcr.io/gondoi/multica-runtime visibility to public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/multica-runtime/visibility" \
            -f visibility=public

  smoke:
    needs: [prepare, docker, make-public]
    if: always() && needs.docker.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: read
    steps:
      - name: Login to GHCR (needed if package still private)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published tag and assert baseline binaries
        env:
          IMAGE: ghcr.io/gondoi/multica-runtime:${{ needs.prepare.outputs.tag }}
          VERSION_IMAGE: ghcr.io/gondoi/multica-runtime:${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker pull "$VERSION_IMAGE"
          docker run --rm --entrypoint /bin/bash "$IMAGE" -lc \
            'command -v multica cursor-agent asdf git ssh jq curl tini aws && aws --version'
          echo "smoke ok: $IMAGE + $VERSION_IMAGE"
