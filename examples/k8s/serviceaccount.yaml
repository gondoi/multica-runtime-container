# PLACEHOLDER — do not apply as-is.
# ServiceAccount the runtime Deployment runs as, for AWS auth tier 1 (IRSA).
#
# Why this exists: with EKS IRSA the pod gets short-lived credentials from a
# projected web-identity token — no static keys in a Secret, nothing to rotate
# in the image. The IAM role is bound to this ServiceAccount in AWS, and the
# annotation below tells the EKS webhook which role to hand the pod.
#
# Preconditions (all outside this repo, see docs/kubernetes.md):
#   1. An IAM role whose trust policy federates your cluster's OIDC provider
#      and allows  system:serviceaccount:<namespace>:<serviceaccount>.
#   2. The cluster's OIDC provider registered with IAM (eksctl does this).
#   3. The cluster has the aws-iam-trust / aws-eks-pod-identity-webhook add-on.
#
# Without any of that, leave this file out: the Deployment still runs (no AWS
# creds), and boot logs `aws auth: none detected …`. Tiers 2 and 3 need no
# ServiceAccount at all — see the README "AWS CLI auth tiers".
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: multica-runtime
  namespace: multica-runtime
  labels:
    app.kubernetes.io/name: multica-runtime
  annotations:
    # Tier 1 (IRSA) — uncomment and REPLACE with the IAM role that trusts this
    # cluster's OIDC provider and this ServiceAccount. Left commented so this
    # manifest applies safely in clusters without IRSA (a plain, annotation-free
    # ServiceAccount is harmless). Scope the role to only what agents must do in
    # AWS — every task running in this pod inherits it.
    # eks.amazonaws.com/role-arn: "arn:aws:iam::REPLACE_ACCOUNT_ID:role/REPLACE_ROLE_NAME"
    # Optional: STS regional endpoints, and token expiry (default 86400 = 24h).
    # eks.amazonaws.com/sts-regional-endpoints: "true"
