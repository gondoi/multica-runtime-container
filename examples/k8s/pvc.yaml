apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: multica-runtime-workspaces
  namespace: multica-runtime
  labels:
    app.kubernetes.io/name: multica-runtime
spec:
  accessModes:
    - ReadWriteOnce
  # storageClassName: set at deploy time for your cluster
  resources:
    requests:
      storage: 50Gi
