# PLACEHOLDER — do not apply with these values.
# In production, replace with SOPS-encrypted Secrets (or your cluster secret manager).
# Keys and mount paths must match deployment.yaml / compose secrets/ layout.
#
# Git auth tiers (resolved App > PAT > password; first complete tier wins):
#   1. GitHub App  — App ID + installation ID + PEM (org-safe, short-lived tokens)
#   2. PAT         — GITHUB_TOKEN
#   3. Password    — GITHUB_USER + GITHUB_PASSWORD (GitHub Enterprise Server only;
#                    github.com rejects password auth — pair with GITHUB_HOST)
# GITHUB_HOST selects the host for all three tiers (default github.com).
# Do not grant the App "bypass branch protection" / admin — protected main stays PR-only.
---
apiVersion: v1
kind: Secret
metadata:
  name: multica-runtime-home
  namespace: multica-runtime
  labels:
    app.kubernetes.io/name: multica-runtime
type: Opaque
stringData:
  config.json: |
    {
      "server_url": "https://api.multica.ai",
      "app_url": "https://multica.ai",
      "workspace_id": "REPLACE_WITH_WORKSPACE_UUID",
      "token": "mul_REPLACE_WITH_PAT"
    }
  daemon.id: |
    REPLACE_WITH_STABLE_DAEMON_ID
---
apiVersion: v1
kind: Secret
metadata:
  name: multica-runtime-cursor
  namespace: multica-runtime
  labels:
    app.kubernetes.io/name: multica-runtime
type: Opaque
stringData:
  CURSOR_API_KEY: "REPLACE_WITH_CURSOR_API_KEY"
---
apiVersion: v1
kind: Secret
metadata:
  name: multica-runtime-git
  namespace: multica-runtime
  labels:
    app.kubernetes.io/name: multica-runtime
type: Opaque
stringData:
  # Option A — static PAT (personal / orgs that allow PATs):
  GITHUB_TOKEN: "REPLACE_WITH_GITHUB_PAT"
  # Option B — GitHub App (org-safe; no PAT). Uncomment and remove GITHUB_TOKEN
  # when switching. Deployment volume items must list the same keys.
  # GITHUB_APP_ID: "123456"
  # GITHUB_APP_INSTALLATION_ID: "12345678"
  # GITHUB_APP_PRIVATE_KEY: |
  #   -----BEGIN RSA PRIVATE KEY-----
  #   REPLACE_WITH_APP_PEM
  #   -----END RSA PRIVATE KEY-----
  # Option C — GitHub Enterprise Server password pair (lowest priority). Also
  # uncomment GITHUB_HOST (all GitHub tiers) and update the Deployment volume
  # items to mount these three keys.
  # GITHUB_HOST: "ghe.example.com"
  # GITHUB_USER: "REPLACE_WITH_GHES_USERNAME"
  # GITHUB_PASSWORD: "REPLACE_WITH_GHES_PASSWORD"
---
# OPTIONAL — Claude Code harness (MULTICA_AGENT_CLI=claude or cursor,claude).
# Put exactly ONE of these keys in the Secret and mount only that key in
# deployment.yaml (a missing key fails the volume mount):
#   ANTHROPIC_API_KEY         — API key (sk-ant-…); long-lived secret
#   CLAUDE_CODE_OAUTH_TOKEN   — token from `claude setup-token`
#   ANTHROPIC_AUTH_TOKEN      — gateway bearer token (pair with ANTHROPIC_BASE_URL)
# HIGHER-RISK, flagged like the GitHub/AWS tiers: whichever credential lands
# here is inherited by every agent task the daemon runs, so scope it to the
# workspace it serves and prefer the OAuth-token tier over a long-lived org key.
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: multica-runtime-claude
#   namespace: multica-runtime
#   labels:
#     app.kubernetes.io/name: multica-runtime
# type: Opaque
# stringData:
#   ANTHROPIC_API_KEY: "REPLACE_WITH_ANTHROPIC_API_KEY"
---
# OPTIONAL — OpenAI Codex harness (MULTICA_AGENT_CLI=codex or a combination).
# Put exactly ONE of these keys in the Secret and mount only that key in
# deployment.yaml (a missing key fails the volume mount):
#   OPENAI_API_KEY  — API key; projected into ~/.codex/auth.json at boot
#   auth.json       — a login created by `codex login` (API key or ChatGPT OAuth)
# Codex ignores OPENAI_API_KEY in the environment and reads
# $CODEX_HOME/auth.json, so the runtime projects the key into that file itself.
# Same risk note as the Claude key: whatever lands here is inherited by every
# task this daemon runs.
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: multica-runtime-codex
#   namespace: multica-runtime
#   labels:
#     app.kubernetes.io/name: multica-runtime
# type: Opaque
# stringData:
#   OPENAI_API_KEY: "REPLACE_WITH_OPENAI_API_KEY"
---
# OPTIONAL — aws-sso SecureStore passphrase (Identity Center / credential_process
# profiles). aws-sso's encrypted `file` store prompts for a passphrase on every
# process that opens it, and an agent task has no TTY, so `aws-sso process` (the
# profile's `credential_process`) can only unlock it from the
# upstream-documented AWS_SSO_FILE_PASSWORD env var.
#
# HIGHER-RISK, flagged for explicit owner review before merge: this secret is the
# ONLY thing between an agent task and the SSO token/role cache on the workspaces
# PVC, and — like the harness keys — whatever lands here is inherited by every
# task the daemon runs (an agent can read `$AWS_SSO_FILE_PASSWORD` from its env).
# It is a passphrase for data at rest on the PVC, not an AWS credential, and it
# never appears in an image, this repo, or a ConfigMap.
#
# The operator login must use the same passphrase, i.e. run it in the pod with
# this Secret mounted. If the PVC already holds a store created with an
# operator-typed passphrase, delete `<workspaces>/.provider-homes/aws-sso/secure/`
# and re-run the operator login so it is recreated with this passphrase.
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: multica-runtime-aws-sso-unlock
#   namespace: multica-runtime
#   labels:
#     app.kubernetes.io/name: multica-runtime
# type: Opaque
# stringData:
#   AWS_SSO_FILE_PASSWORD: "REPLACE_WITH_SECURESTORE_PASSPHRASE"
---
# OPTIONAL — AWS auth tier 3 (mounted config/credentials). Least preferred:
# prefer IRSA (serviceaccount.yaml) or an EC2/ECS role, neither of which needs
# any secret here. Apply this Secret ONLY if you must use static keys or a
# non-IRSA profile/sso profile, and then:
#   - uncomment the `aws` volume + volumeMount and the AWS_CONFIG_FILE /
#     AWS_SHARED_CREDENTIALS_FILE env vars in deployment.yaml,
#   - point those env vars at config / credentials below.
# Keys are mounted as files with 0400 by kubelet (fsGroup applies) and the
# runtime never copies or logs them — see README "AWS CLI auth tiers".
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: multica-runtime-aws
#   namespace: multica-runtime
#   labels:
#     app.kubernetes.io/name: multica-runtime
# type: Opaque
# stringData:
#   config: |
#     [default]
#     region = us-east-1
#     output = json
#   credentials: |
#     [default]
#     aws_access_key_id = REPLACE_WITH_ACCESS_KEY_ID
#     aws_secret_access_key = REPLACE_WITH_SECRET_ACCESS_KEY
#     # aws_session_token = REPLACE_WITH_SESSION_TOKEN
