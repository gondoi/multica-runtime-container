# PLACEHOLDER — do not apply with these values.
# In production, replace with SOPS-encrypted Secrets (or your cluster secret manager).
# Keys and mount paths must match deployment.yaml / compose secrets/ layout.
#
# Git auth tiers (resolved App > PAT > password; first complete tier wins):
#   1. GitHub App  — App ID + installation ID + PEM (org-safe, short-lived tokens)
#   2. PAT         — GITHUB_TOKEN
#   3. Password    — GITHUB_USER + GITHUB_PASSWORD (GitHub Enterprise Server only;
#                    github.com rejects password auth — pair with GITHUB_HOST)
# GITHUB_HOST selects the host for all three tiers (default github.com).
# Do not grant the App "bypass branch protection" / admin — protected main stays PR-only.
---
apiVersion: v1
kind: Secret
metadata:
  name: multica-runtime-home
  namespace: multica-runtime
  labels:
    app.kubernetes.io/name: multica-runtime
type: Opaque
stringData:
  config.json: |
    {
      "server_url": "https://api.multica.ai",
      "app_url": "https://multica.ai",
      "workspace_id": "REPLACE_WITH_WORKSPACE_UUID",
      "token": "mul_REPLACE_WITH_PAT"
    }
  daemon.id: |
    REPLACE_WITH_STABLE_DAEMON_ID
---
apiVersion: v1
kind: Secret
metadata:
  name: multica-runtime-cursor
  namespace: multica-runtime
  labels:
    app.kubernetes.io/name: multica-runtime
type: Opaque
stringData:
  CURSOR_API_KEY: "REPLACE_WITH_CURSOR_API_KEY"
---
apiVersion: v1
kind: Secret
metadata:
  name: multica-runtime-git
  namespace: multica-runtime
  labels:
    app.kubernetes.io/name: multica-runtime
type: Opaque
stringData:
  # Option A — static PAT (personal / orgs that allow PATs):
  GITHUB_TOKEN: "REPLACE_WITH_GITHUB_PAT"
  # Option B — GitHub App (org-safe; no PAT). Uncomment and remove GITHUB_TOKEN
  # when switching. Deployment volume items must list the same keys.
  # GITHUB_APP_ID: "123456"
  # GITHUB_APP_INSTALLATION_ID: "12345678"
  # GITHUB_APP_PRIVATE_KEY: |
  #   -----BEGIN RSA PRIVATE KEY-----
  #   REPLACE_WITH_APP_PEM
  #   -----END RSA PRIVATE KEY-----
  # Option C — GitHub Enterprise Server password pair (lowest priority). Also
  # uncomment GITHUB_HOST (all GitHub tiers) and update the Deployment volume
  # items to mount these three keys.
  # GITHUB_HOST: "ghe.example.com"
  # GITHUB_USER: "REPLACE_WITH_GHES_USERNAME"
  # GITHUB_PASSWORD: "REPLACE_WITH_GHES_PASSWORD"
---
# OPTIONAL — AWS auth tier 3 (mounted config/credentials). Least preferred:
# prefer IRSA (serviceaccount.yaml) or an EC2/ECS role, neither of which needs
# any secret here. Apply this Secret ONLY if you must use static keys or a
# non-IRSA profile/sso profile, and then:
#   - uncomment the `aws` volume + volumeMount and the AWS_CONFIG_FILE /
#     AWS_SHARED_CREDENTIALS_FILE env vars in deployment.yaml,
#   - point those env vars at config / credentials below.
# Keys are mounted as files with 0400 by kubelet (fsGroup applies) and the
# runtime never copies or logs them — see README "AWS CLI auth tiers".
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: multica-runtime-aws
#   namespace: multica-runtime
#   labels:
#     app.kubernetes.io/name: multica-runtime
# type: Opaque
# stringData:
#   config: |
#     [default]
#     region = us-east-1
#     output = json
#   credentials: |
#     [default]
#     aws_access_key_id = REPLACE_WITH_ACCESS_KEY_ID
#     aws_secret_access_key = REPLACE_WITH_SECRET_ACCESS_KEY
#     # aws_session_token = REPLACE_WITH_SESSION_TOKEN
