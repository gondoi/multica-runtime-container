apiVersion: apps/v1
kind: Deployment
metadata:
  name: multica-runtime
  namespace: multica-runtime
  labels:
    app.kubernetes.io/name: multica-runtime
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: multica-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: multica-runtime
    spec:
      # AWS auth tier 1 (IRSA) hooks onto this ServiceAccount — see
      # serviceaccount.yaml. A plain ServiceAccount (no annotation) is fine:
      # the pod just gets no AWS credentials.
      serviceAccountName: multica-runtime
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        # OpenAI Codex harness only: codex's Linux sandbox (workspace-write, the
        # mode the Multica daemon asks for) runs commands through bubblewrap,
        # which needs unprivileged user + mount namespaces. Default seccomp /
        # AppArmor profiles can block that, and the task then fails with
        # "bwrap: No permissions to create new namespace". Unverified on every
        # CNI/runtime: confirm with
        #   kubectl exec deploy/multica-runtime -- codex sandbox -- /bin/echo ok
        # and relax these only if it fails. They weaken isolation for every
        # harness in this pod, so they are opt-in.
        # seccompProfile:
        #   type: Unconfined
        # appArmorProfile:
        #   type: Unconfined
      containers:
        - name: runtime
          image: ghcr.io/gondoi/multica-runtime:vX.Y.Z
          imagePullPolicy: IfNotPresent
          env:
            - name: MULTICA_HOME_SECRET_DIR
              value: /run/secrets/multica-home
            - name: CURSOR_API_KEY_FILE
              value: /run/secrets/cursor/CURSOR_API_KEY
            # Agent CLI harnesses provisioned + gated at boot: cursor | claude |
            # codex | any comma combination. Default cursor = pre-Claude boot
            # contract unchanged.
            - name: MULTICA_AGENT_CLI
              value: cursor
            # Claude Code harness (use with MULTICA_AGENT_CLI=claude or
            # cursor,claude). One credential key is enough. Requires the
            # `claude` Secret + volume/mount further down — comment both in if
            # you add the Secret, or the pod fails to mount.
            # - name: ANTHROPIC_API_KEY_FILE
            #   value: /run/secrets/claude/ANTHROPIC_API_KEY
            # - name: CLAUDE_CODE_OAUTH_TOKEN_FILE
            #   value: /run/secrets/claude/CLAUDE_CODE_OAUTH_TOKEN
            # - name: ANTHROPIC_AUTH_TOKEN_FILE
            #   value: /run/secrets/claude/ANTHROPIC_AUTH_TOKEN
            # OpenAI Codex harness (use with MULTICA_AGENT_CLI=codex or a
            # combination). Provide ONE of: the API key file (projected into
            # ~/.codex/auth.json at boot) or an auth.json from `codex login`.
            # Requires the `codex` Secret + volume/mount further down.
            # - name: OPENAI_API_KEY_FILE
            #   value: /run/secrets/codex/OPENAI_API_KEY
            # - name: CODEX_AUTH_JSON_FILE
            #   value: /run/secrets/codex/auth.json
            - name: GITHUB_TOKEN_FILE
              value: /run/secrets/git/GITHUB_TOKEN
            # Optional GitHub App path (org-safe; replaces PAT when mounted):
            # - name: GITHUB_APP_ID_FILE
            #   value: /run/secrets/git/GITHUB_APP_ID
            # - name: GITHUB_APP_INSTALLATION_ID_FILE
            #   value: /run/secrets/git/GITHUB_APP_INSTALLATION_ID
            # - name: GITHUB_APP_PRIVATE_KEY_FILE
            #   value: /run/secrets/git/GITHUB_APP_PRIVATE_KEY
            # Optional GitHub Enterprise Server password tier (lowest priority):
            # - name: GITHUB_HOST_FILE
            #   value: /run/secrets/git/GITHUB_HOST
            # - name: GITHUB_USER_FILE
            #   value: /run/secrets/git/GITHUB_USER
            # - name: GITHUB_PASSWORD_FILE
            #   value: /run/secrets/git/GITHUB_PASSWORD
            - name: MULTICA_WORKSPACES_ROOT
              value: /home/agent/workspaces
            - name: MULTICA_AGENT_RUNTIME_NAME
              value: multica-runtime
            # Runtime-list display name: multica shows "<Provider> (<machine name>)",
            # e.g. "Cursor (fuel-general)" / "Claude (fuel-general)". Default when unset: the pod hostname
            # (multica-runtime-6cc749d9f7-dr2gh). Set it per deployment.
            # - name: MULTICA_MACHINE_NAME
            #   value: fuel-general
            # Daemon log level mirrored to container stdout: DEBUG|INFO|WARN|ERROR
            # (default INFO). Collection-side filter — the daemon's own
            # ~/.multica/daemon.log always records DEBUG.
            - name: MULTICA_LOG_LEVEL
              value: INFO
            # Optional: pin default workspace after login (slug, name, or UUID).
            # Falls back to projected Secret config.json .workspace_id when unset.
            # Prefer consumer overlay for tenant-specific values.
            # - name: MULTICA_WORKSPACE
            #   value: fuel-labs
            #
            # AWS: no credential env vars here by design. Tier 1 (IRSA) is
            # wired by the ServiceAccount annotation above and needs nothing
            # in the pod spec. Optional tier 3 — a mounted config/credentials
            # file — uncomment both this block and the `aws` volume/mount below:
            # - name: AWS_CONFIG_FILE
            #   value: /run/secrets/aws/config
            # - name: AWS_SHARED_CREDENTIALS_FILE
            #   value: /run/secrets/aws/credentials
            # - name: AWS_REGION
            #   value: us-east-1
            #
            # aws-sso SecureStore passphrase (`credential_process` profiles).
            # The encrypted `file` store asks for a passphrase on every open and
            # agent tasks have no TTY, so aws-sso reads it from its own variable
            # AWS_SSO_FILE_PASSWORD. HIGHER-RISK: every task inherits it and can
            # read it from its own env (it protects the SSO cache at rest; it is
            # not an AWS credential).
            #
            # RECOMMENDED — pass the passphrase itself straight from a Secret.
            # The name has NO `_FILE` suffix because the value is the passphrase.
            # Because it is in the pod env, the daemon, every task AND an
            # interactive `kubectl exec` operator login all get it, so the
            # operator login never prompts and cannot pick a different
            # passphrase than the agents use.
            # - name: AWS_SSO_FILE_PASSWORD
            #   valueFrom:
            #     secretKeyRef:
            #       name: multica-runtime-aws-sso-unlock
            #       key: AWS_SSO_FILE_PASSWORD
            #
            # ALTERNATIVE — mount the passphrase as a file and point
            # MULTICA_AWS_SSO_PASSPHRASE_FILE at it. Note the shape difference:
            # that variable is a PATH TO A FILE, so its name ends in `_FILE` —
            # the passphrase file it points at is still `AWS_SSO_FILE_PASSWORD`.
            # Trade-off: the value reaches the daemon and its tasks only, so a
            # later `kubectl exec` operator login PROMPTS for the passphrase and
            # must be given the same value, or the store diverges and agents
            # fail closed again. Requires the `aws-sso-unlock` volume/mount
            # below (commented out, same as this block).
            # - name: MULTICA_AWS_SSO_PASSPHRASE_FILE
            #   value: /run/secrets/aws-sso/AWS_SSO_FILE_PASSWORD
          volumeMounts:
            - name: workspaces
              mountPath: /home/agent/workspaces
            - name: multica-home
              mountPath: /run/secrets/multica-home
              readOnly: true
            - name: cursor
              mountPath: /run/secrets/cursor
              readOnly: true
            # Optional — Claude Code harness credentials (see claude Secret in
            # secret.example.yaml). Uncomment together with the volume below and
            # the ANTHROPIC_*_FILE env vars above.
            # - name: claude
            #   mountPath: /run/secrets/claude
            #   readOnly: true
            # Optional — OpenAI Codex harness credentials (see codex Secret in
            # secret.example.yaml). Uncomment together with the volume below and
            # the OPENAI_API_KEY_FILE / CODEX_AUTH_JSON_FILE env var above.
            # - name: codex
            #   mountPath: /run/secrets/codex
            #   readOnly: true
            - name: git
              mountPath: /run/secrets/git
              readOnly: true
            # Optional — AWS auth tier 3 static keys (mounted config/credentials).
            # Requires the `aws` volume below AND the matching Secret to exist.
            # - name: aws
            #   mountPath: /run/secrets/aws
            #   readOnly: true
            # Optional — aws-sso passphrase as a FILE (the alternative wiring
            # above). Only needed when using MULTICA_AWS_SSO_PASSPHRASE_FILE;
            # the recommended secretKeyRef env var needs no mount.
            # - name: aws-sso-unlock
            #   mountPath: /run/secrets/aws-sso
            #   readOnly: true
            # AWS ConfigMaps (subPath) — SSO cache on workspaces PVC via
            # entrypoint links under .provider-homes/{aws,aws-sso}/.
            - name: aws-config
              mountPath: /run/config/aws/config
              subPath: config
              readOnly: true
            - name: aws-sso-config
              mountPath: /run/config/aws-sso/config.yaml
              subPath: config.yaml
              readOnly: true

          startupProbe:
            exec:
              command: ["/usr/local/bin/ready.sh"]
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            exec:
              command: ["/usr/local/bin/ready.sh"]
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["/usr/local/bin/ready.sh"]
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: workspaces
          persistentVolumeClaim:
            claimName: multica-runtime-workspaces
        - name: multica-home
          secret:
            secretName: multica-runtime-home
            items:
              - key: config.json
                path: config.json
              - key: daemon.id
                path: daemon.id
        - name: cursor
          secret:
            secretName: multica-runtime-cursor
            items:
              - key: CURSOR_API_KEY
                path: CURSOR_API_KEY
        # Optional — Claude Code harness. Mount ONLY the credential key you
        # actually put in the Secret (the kubelet fails the mount on a missing
        # key). Then uncomment the matching *_FILE env var and the `claude`
        # volumeMount above.
        # - name: claude
        #   secret:
        #     secretName: multica-runtime-claude
        #     items:
        #       - key: ANTHROPIC_API_KEY
        #         path: ANTHROPIC_API_KEY
        # Optional — OpenAI Codex harness. Mount ONLY the key you put in the
        # Secret (the kubelet fails the mount on a missing key): either
        # OPENAI_API_KEY, or auth.json from `codex login`. Then uncomment the
        # matching env var and the `codex` volumeMount above.
        # - name: codex
        #   secret:
        #     secretName: multica-runtime-codex
        #     items:
        #       - key: OPENAI_API_KEY
        #         path: OPENAI_API_KEY
        - name: git
          secret:
            secretName: multica-runtime-git
            # PAT path (default). For App auth, replace items with:
            #   GITHUB_APP_ID, GITHUB_APP_INSTALLATION_ID, GITHUB_APP_PRIVATE_KEY
            # For GHES password auth, add: GITHUB_HOST, GITHUB_USER, GITHUB_PASSWORD
            # (and drop GITHUB_TOKEN). Secret keys must match items or the pod fails to mount.
            items:
              - key: GITHUB_TOKEN
                path: GITHUB_TOKEN
        # Optional — AWS auth tier 3 static keys (least preferred; prefer IRSA).
        # - name: aws
        #   secret:
        #     secretName: multica-runtime-aws-static
        #     items:
        #       - key: config
        #         path: config
        #       - key: credentials
        #         path: credentials
        # Optional — aws-sso passphrase as a FILE (alternative to the
        # recommended secretKeyRef env var). Uncomment together with the
        # MULTICA_AWS_SSO_PASSPHRASE_FILE env var and the `aws-sso-unlock` mount
        # above. The Secret key stays AWS_SSO_FILE_PASSWORD — that is the
        # passphrase; only the variable that points at this file carries `_FILE`.
        # - name: aws-sso-unlock
        #   secret:
        #     secretName: multica-runtime-aws-sso-unlock
        #     items:
        #       - key: AWS_SSO_FILE_PASSWORD
        #         path: AWS_SSO_FILE_PASSWORD
        - name: aws-config
          configMap:
            name: multica-runtime-aws
            items:
              - key: config
                path: config
        - name: aws-sso-config
          configMap:
            name: multica-runtime-aws-sso
            items:
              - key: config.yaml
                path: config.yaml

